<!DOCTYPE html><html xmlns:th="https://www.thymeleaf.org" lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nueva Venta - Sistema de Ventas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"><style>.sidebar{min-height:100vh;background:#343a40;color:white}.sidebar .nav-link{color:rgba(255,255,255,.75)}.sidebar .nav-link:hover,.sidebar .nav-link.active{color:white;background:rgba(255,255,255,.1)}.sidebar .nav-link i{width:20px}.main-content{padding:2rem}.card{box-shadow:0 0.125rem 0.25rem rgba(0,0,0,.075)}.table th{background-color:#f8f9fa}.btn-group-sm>.btn{padding:0.25rem 0.5rem;font-size:0.875rem}</style></head><body><div class="container-fluid"><div class="row"><nav class="col-md-3 col-lg-2 d-md-block sidebar collapse"><div class="position-sticky pt-3"><h4 class="text-center mb-4"><i class="bi bi-cart-check"></i> Sistema Ventas</h4><ul class="nav flex-column"><li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2"></i> Dashboard</a></li><li class="nav-item"><a class="nav-link" th:href="@{/categorias}"><i class="bi bi-tags"></i> Categorías</a></li><li class="nav-item"><a class="nav-link" th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li><li class="nav-item"><a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people"></i> Clientes</a></li><li class="nav-item"><a class="nav-link" th:href="@{/empleados}"><i class="bi bi-person-badge"></i> Empleados</a></li><li class="nav-item"><a class="nav-link active" th:href="@{/ventas}"><i class="bi bi-receipt"></i> Ventas</a></li><li class="nav-item"><a class="nav-link" th:href="@{/detalles}"><i class="bi bi-list-ul"></i> Detalles Venta</a></li></ul></div></nav><main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content"><nav class="navbar navbar-expand navbar-light bg-light rounded mb-4"><div class="container-fluid"><h5 class="mb-0"><i class="bi bi-receipt"></i> Nueva Venta</h5><div class="ms-auto"><span class="text-muted me-3"><i class="bi bi-database"></i> Conectado a laboratorio_api</span></div></div></nav><div th:if="${message}" class="alert alert-success alert-dismissible fade show"><span th:text="${message}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div><div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div><div class="row justify-content-center"><div class="col-12"><div class="card"><div class="card-header"><h5 class="mb-0"><i class="bi bi-receipt"></i> Nueva Venta</h5></div><div class="card-body"><form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" id="ventaForm"><input type="hidden" th:field="*{id}" /><div class="row mb-4"><div class="col-md-4 mb-3"><label for="fecha" class="form-label">Fecha <span class="text-danger">*</span></label><input type="date" class="form-control" id="fecha" th:field="*{fecha}" required></div><div class="col-md-4 mb-3"><label for="cliente" class="form-label">Cliente <span class="text-danger">*</span></label><select class="form-select" id="cliente" th:field="*{cliente}" required><option value="">-- Seleccionar cliente --</option><option th:each="cli : ${clientes}" th:value="${cli.id}" th:text="${cli.nombre + ' ' + cli.apellido}"></option></select></div><div class="col-md-4 mb-3"><label for="empleado" class="form-label">Empleado <span class="text-danger">*</span></label><select class="form-select" id="empleado" th:field="*{empleado}" required><option value="">-- Seleccionar empleado --</option><option th:each="emp : ${empleados}" th:value="${emp.id}" th:text="${emp.nombre + ' ' + emp.apellido + ' (' + emp.cargo + ')'}"></option></select></div></div><hr><h5 class="mb-3"><i class="bi bi-cart"></i> Productos</h5><div id="productosContainer"><div class="row producto-row mb-3 align-items-end"><div class="col-md-5"><label class="form-label">Producto</label><select class="form-select producto-select" name="productoIds" required><option value="">-- Seleccionar producto --</option><option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre + ' - S/ ' + #numbers.formatDecimal(p.precio, 1, 2, 'COMMA') + ' (Stock: ' + p.stock + ')'}"></option></select></div><div class="col-md-3"><label class="form-label">Cantidad</label><input type="number" class="form-control cantidad-input" name="cantidades" min="1" value="1" required></div><div class="col-md-3"><label class="form-label">Subtotal</label><input type="text" class="form-control subtotal-display" readonly placeholder="S/ 0.00"></div><div class="col-md-1"><label class="form-label d-block">&nbsp;</label><button type="button" class="btn btn-outline-danger btn-sm btn-remove-producto w-100" title="Eliminar"><i class="bi bi-trash"></i></button></div></div></div><button type="button" id="btnAgregarProducto" class="btn btn-outline-secondary mb-3"><i class="bi bi-plus-circle"></i> Agregar Producto</button><hr><div class="row justify-content-end"><div class="col-md-4"><div class="input-group input-group-lg"><span class="input-group-text bg-danger text-white fw-bold">Total:</span><input type="text" class="form-control form-control-lg text-end fw-bold bg-light" id="totalVenta" readonly value="S/ 0.00"></div></div></div><div class="d-flex justify-content-end gap-2 mt-4"><button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-save"></i> Registrar Venta</button><a href="/ventas" class="btn btn-secondary btn-lg"><i class="bi bi-x-circle"></i> Cancelar</a></div></form></div></div></div></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script><script>const preciosProductos={}; <th:block th:each="p : ${productos}">preciosProductos[<th:text="${p.id}"/>]=<th:text="${p.precio}"/>;</th:block>let productoIndex=0;function actualizarSubtotal(row){const select=row.querySelector('.producto-select');const cantidad=row.querySelector('.cantidad-input');const subtotalDisplay=row.querySelector('.subtotal-display');const productoId=parseInt(select.value);const cant=parseInt(cantidad.value)||0;const precio=preciosProductos[productoId]||0;const subtotal=precio*cant;subtotalDisplay.value='S/ '+subtotal.toFixed(2);actualizarTotal();}function actualizarTotal(){let total=0;document.querySelectorAll('.producto-row').forEach(row=>{const select=row.querySelector('.producto-select');const cantidad=row.querySelector('.cantidad-input');const productoId=parseInt(select.value);const cant=parseInt(cantidad.value)||0;const precio=preciosProductos[productoId]||0;total+=precio*cant;});document.getElementById('totalVenta').value='S/ '+total.toFixed(2);}document.getElementById('btnAgregarProducto').addEventListener('click',function(){productoIndex++;const container=document.getElementById('productosContainer');const div=document.createElement('div');div.className='row producto-row mb-3 align-items-end';div.innerHTML=`<div class="col-md-5"><label class="form-label">Producto</label><select class="form-select producto-select" name="productoIds" required><option value="">-- Seleccionar producto --</option>${Array.from(document.querySelectorAll('.producto-select option')).slice(1).map(o=>o.outerHTML).join('')}</select></div><div class="col-md-3"><label class="form-label">Cantidad</label><input type="number" class="form-control cantidad-input" name="cantidades" min="1" value="1" required></div><div class="col-md-3"><label class="form-label">Subtotal</label><input type="text" class="form-control subtotal-display" readonly placeholder="S/ 0.00"></div><div class="col-md-1"><label class="form-label d-block">&nbsp;</label><button type="button" class="btn btn-outline-danger btn-sm btn-remove-producto w-100" title="Eliminar"><i class="bi bi-trash"></i></button></div>`;container.appendChild(div);div.querySelector('.producto-select').addEventListener('change',()=>actualizarSubtotal(div));div.querySelector('.cantidad-input').addEventListener('input',()=>actualizarSubtotal(div));div.querySelector('.btn-remove-producto').addEventListener('click',()=>{if(document.querySelectorAll('.producto-row').length>1){div.remove();actualizarTotal();}else{div.querySelector('.producto-select').value='';div.querySelector('.cantidad-input').value=1;div.querySelector('.subtotal-display').value='S/ 0.00';actualizarTotal();}});});document.querySelectorAll('.producto-row').forEach(row=>{row.querySelector('.producto-select').addEventListener('change',()=>actualizarSubtotal(row));row.querySelector('.cantidad-input').addEventListener('input',()=>actualizarSubtotal(row));row.querySelector('.btn-remove-producto').addEventListener('click',()=>{if(document.querySelectorAll('.producto-row').length>1){row.remove();actualizarTotal();}else{row.querySelector('.producto-select').value='';row.querySelector('.cantidad-input').value=1;row.querySelector('.subtotal-display').value='S/ 0.00';actualizarTotal();}});});</script></body></html>
