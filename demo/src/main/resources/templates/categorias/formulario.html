<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoria.id != null ? 'Editar' : 'Nueva'} + ' Categoría'">Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #343a40; color: white; }
        .sidebar .nav-link { color: rgba(255,255,255,.75); }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background: rgba(255,255,255,.1); }
        .sidebar .nav-link i { width: 20px; }
        .main-content { padding: 2rem; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075); }
        .table th { background-color: #f8f9fa; }
        .btn-group-sm > .btn { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <h4 class="text-center mb-4"><i class="bi bi-cart-check"></i> Sistema Ventas</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" th:href="@{/}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link active" th:href="@{/categorias}"><i class="bi bi-tags"></i> Categorías</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/productos}"><i class="bi bi-box-seam"></i> Productos</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people"></i> Clientes</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/empleados}"><i class="bi bi-person-badge"></i> Empleados</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/ventas}"><i class="bi bi-receipt"></i> Ventas</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/detalles}"><i class="bi bi-list-ul"></i> Detalles Venta</a></li>
                    </ul>
                </div>
            </nav>
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <nav class="navbar navbar-expand navbar-light bg-light rounded mb-4">
                    <div class="container-fluid">
                        <h5 class="mb-0" th:text="${categoria.id != null ? 'Editar Categoría' : 'Nueva Categoría'}"></h5>
                        <div class="ms-auto"><span class="text-muted me-3"><i class="bi bi-database"></i> Conectado a laboratorio_api</span></div>
                    </div>
                </nav>
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show"><span th:text="${message}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show"><span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header"><h5 class="mb-0"><i class="bi bi-tag"></i> <span th:text="${categoria.id != null ? 'Editar Categoría' : 'Nueva Categoría'}"></span></h5></div>
                            <div class="card-body">
                                <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
                                    <input type="hidden" th:field="*{id}" />
                                    <div class="mb-3">
                                        <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required maxlength="100" placeholder="Ej: Electrónicos, Ropa, Alimentos...">
                                    </div>
                                    <div class="mb-3">
                                        <label for="descripcion" class="form-label">Descripción</label>
                                        <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3" maxlength="255" placeholder="Descripción opcional de la categoría"></textarea>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
                                        <a href="/categorias" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>document.querySelectorAll('.btn-delete').forEach(btn=>btn.addEventListener('click',e=>{if(!confirm('¿Está seguro de eliminar este registro?'))e.preventDefault();})); </script>
</body>
</html>
